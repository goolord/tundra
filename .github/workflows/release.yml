name: Release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to
        required: true
        default: v0.1.0-pre-alpha

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libssl-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev pkg-config

      - name: Download Essentia models
        run: cargo xtask models

      - name: Build release package
        run: cargo xtask package --version "${{ inputs.tag }}" --target ${{ matrix.target }}

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" target/tundra-"${{ inputs.tag }}"-${{ matrix.target }}.* --clobber
