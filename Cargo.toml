[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "tundra"
version = "0.1.0"
authors = ["Zachary Churchill <zacharyachurchill@gmail.com>"]
edition = "2024"
build = "build.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu-bare", "tiny-skia", "svg", "canvas", "crisp", "web-colors", "thread-pool", "x11", "wayland", "linux-theme-detection"] }
rodio = "0.21"
walkdir = "2.5"
fuzzy-matcher = "0.3"
futures = "0.3"
async-io = "2"
iced_aw = { version = "0.14", features = ["menu", "context_menu"] }
dirs = "6"
bincode = "1.3"
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# wgpu backends via feature unification (not iced's full `wgpu` — avoids DX12/windows mismatch).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl", "parking_lot", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl", "parking_lot", "metal"] }
rfd = "0.15"
drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
drag = "2.1.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
debug = false

[profile.release.build-override]
opt-level = 0
codegen-units = 16

# Fast compile + run for `cargo xtask run --release` (still opt-level 3, dynamic CRT).
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 256
strip = false

[profile.release-fast.build-override]
opt-level = 0
codegen-units = 256
