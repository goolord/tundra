[package]
name = "tundra"
version = "0.1.0"
authors = ["Zachary Churchill <zacharyachurchill@gmail.com>"]
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["svg", "canvas"] }
rodio = "0.21"
walkdir = "2.5"
fuzzy-matcher = "0.3"
futures = "0.3"
async-io = "2"
iced_aw = { version = "0.14", features = ["menu", "context_menu"] }
dirs = "6"
bincode = "1.3"
lofty = "0.25"
serde = { version = "1", features = ["derive"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = "0.15"
drag = "2.1.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
