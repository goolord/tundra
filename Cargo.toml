[package]
name = "tundra"
version = "0.1.0"
authors = ["Zachary Churchill <zacharyachurchill@gmail.com>"]
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["svg", "canvas"] }
rodio = "0.21"
walkdir = "2.5"
fuzzy-matcher = "0.3"
futures = "0.3"
async-io = "2"
iced_aw = { version = "0.14", features = ["menu"] }
dirs = "6"
bincode = "1.3"
rfd = "0.15"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
