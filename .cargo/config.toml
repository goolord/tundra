[alias]
xtask = "run --package xtask --"

# Link the C runtime statically on Windows MSVC so release binaries run without
# the Visual C++ redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# --- Linux (glibc) ---
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--gc-sections"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--gc-sections"]

# musl static linking (no GTK/rfd — not viable for this GUI app; kept for headless experiments).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-Wl,--gc-sections",
]

# Windows-gnu linkers live in Cross.toml (cross container) to avoid breaking MSVC-only Windows hosts.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# macOS targets: build natively on macOS, or set linker to osxcross/clang on Linux hosts.
