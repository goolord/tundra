[alias]
xtask = "run --package xtask --"

# Static CRT is required for the `release` profile on Windows (see build.rs). Dev and `release-fast` use dynamic CRT.

# Drop unused sections; fully static musl binary on Linux-gnu alternative below still uses gtk rfd.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=-static",
    "-C", "link-arg=-Wl,--gc-sections",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--gc-sections"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--gc-sections"]
