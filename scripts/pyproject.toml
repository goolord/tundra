[project]
name = "tundra-classifiers"
version = "0.1.0"
description = "Tier 1/2 audio classifiers for Tundra auto-tag"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[dependency-groups]
dl = [
    "onnxruntime>=1.16",
]

[tool.uv]
package = false
